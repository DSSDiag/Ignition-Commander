[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

; Partition table for RainMaker (requires more app space)
board_build.partitions = rainmaker.csv

; Enable USB CDC on Boot for Serial Monitor
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Dependencies
lib_deps =
    ; ESP RainMaker is usually included in the Arduino ESP32 core,
    ; but explicitly adding it if using a library manager version or
    ; ensuring the board package is up to date is good practice.
    ; For PlatformIO, we rely on the framework-arduinoespressif32 which includes it.
    ; However, sometimes "RainMaker" library is separate in registry.
    ; We will assume standard core usage.
